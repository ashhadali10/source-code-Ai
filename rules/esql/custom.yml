rules:
  - id: esql-dynamic-sql-concatenation
    languages: [generic]
    severity: WARNING
    message: Dynamic SQL construction via string concatenation detected.
    pattern-regex: "(?i)\\bSET\\s+[A-Za-z_][A-Za-z0-9_.]*\\s*=\\s*[^;\\n]*\\|\\|[^;\\n]*"
    paths:
      include: ["*.esql"]
    metadata:
      severity: HIGH
      cwe: CWE-89
      owasp: A03:2021
  - id: esql-hardcoded-credentials
    languages: [generic]
    severity: ERROR
    message: Hardcoded credential value in ESQL source.
    pattern-regex: "(?i)\\b(password|passwd|pwd|secret|token|api[_-]?key)\\w*\\s*=\\s*['\"][^'\"]{6,}['\"]"
    paths:
      include: ["*.esql"]
    metadata:
      severity: CRITICAL
      cwe: CWE-798
      owasp: A07:2021
  - id: esql-passthru-dynamic
    languages: [generic]
    severity: WARNING
    message: PASSTHRU executing a variable - verify the variable is not built by string concatenation.
    pattern-regex: "(?i)\\bPASSTHRU\\s*\\(?\\s*[A-Za-z_][A-Za-z0-9_.]*"
    paths:
      include: ["*.esql"]
    metadata:
      severity: MEDIUM
      cwe: CWE-89
      owasp: A03:2021
